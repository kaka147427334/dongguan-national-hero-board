<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>东莞区域 · 国庆喜报 · 10月7日产出订单153台</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#2a0508;padding:24px;font-family:-apple-system,PingFang SC,Microsoft YaHei,sans-serif;display:flex;justify-content:center;}
  .page{position:relative;width:900px;max-width:100%;border-radius:22px;overflow:hidden;padding:0 0 26px;
        background:
          radial-gradient(900px 520px at 50% -8%, #7a2a00 0%, rgba(122,42,0,0) 62%),
          radial-gradient(700px 420px at 6% 10%, rgba(255,60,60,.28) 0%, rgba(255,60,60,0) 60%),
          radial-gradient(700px 420px at 94% 14%, rgba(255,140,0,.22) 0%, rgba(255,140,0,0) 60%),
          linear-gradient(180deg,#6b1016 0%,#4a0a10 40%,#2b0509 100%);
        box-shadow:0 18px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,215,120,.28);}
  body.plain{background:#fff;padding:0;}
  body.plain .page{box-shadow:none;border-radius:0;}

  /* 放射光束 */
  .rays{position:absolute;top:-520px;left:50%;width:1800px;height:1800px;margin-left:-900px;pointer-events:none;
        background:repeating-conic-gradient(from 0deg at 50% 50%,
          rgba(255,226,150,.22) 0deg 4deg,
          rgba(255,226,150,0) 4deg 11deg);
        -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 0%, rgba(0,0,0,.6) 32%, rgba(0,0,0,0) 64%);
        mask-image:radial-gradient(circle at 50% 50%, #000 0%, rgba(0,0,0,.6) 32%, rgba(0,0,0,0) 64%);
        animation:spin 48s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .rays2{position:absolute;top:-360px;left:50%;width:1400px;height:1400px;margin-left:-700px;pointer-events:none;
        background:repeating-conic-gradient(from 6deg at 50% 50%,
          rgba(255,255,255,.10) 0deg 2deg,
          rgba(255,255,255,0) 2deg 16deg);
        -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 0%, rgba(0,0,0,.45) 30%, rgba(0,0,0,0) 60%);
        mask-image:radial-gradient(circle at 50% 50%, #000 0%, rgba(0,0,0,.45) 30%, rgba(0,0,0,0) 60%);
        animation:spin2 70s linear infinite reverse;}
  @keyframes spin2{to{transform:rotate(360deg);}}

  .glow{position:absolute;top:-160px;left:50%;width:900px;height:470px;margin-left:-450px;pointer-events:none;
        background:radial-gradient(ellipse at 50% 50%, rgba(255,220,130,.40) 0%, rgba(255,180,60,.15) 38%, rgba(255,150,40,0) 70%);
        filter:blur(8px);}

  .spark{position:absolute;width:10px;height:10px;pointer-events:none;border-radius:50%;
        background:radial-gradient(circle,#fff 0%,rgba(255,240,190,.95) 32%,rgba(255,210,100,0) 72%);
        animation:tw 2.6s ease-in-out infinite;}
  .spark::before,.spark::after{content:'';position:absolute;left:50%;top:50%;border-radius:2px;
        background:linear-gradient(90deg,rgba(255,245,205,0),rgba(255,245,205,.95),rgba(255,245,205,0));}
  .spark::before{width:40px;height:1.6px;transform:translate(-50%,-50%);}
  .spark::after{width:1.6px;height:40px;transform:translate(-50%,-50%);
        background:linear-gradient(180deg,rgba(255,245,205,0),rgba(255,245,205,.95),rgba(255,245,205,0));}
  @keyframes tw{0%{opacity:.5;transform:scale(.75) rotate(0deg);}50%{opacity:1;transform:scale(1.15) rotate(45deg);}100%{opacity:.5;transform:scale(.75) rotate(90deg);}}

  header{position:relative;z-index:2;padding:34px 28px 24px;text-align:center;}
  .eyebrow{display:inline-block;padding:6px 20px;border-radius:22px;font-size:14px;font-weight:800;letter-spacing:3px;
     color:#5c1800;-webkit-text-fill-color:#5c1800;
     background:linear-gradient(180deg,#ffe9a8,#ffb62e);
     box-shadow:0 0 18px rgba(255,180,60,.65), 0 4px 12px rgba(0,0,0,.35);}
  .xibao{margin:16px 0 0;font-size:76px;font-weight:900;letter-spacing:16px;line-height:1.1;
     background:linear-gradient(180deg,#fffdf3 0%,#ffe9a0 38%,#ffc21e 70%,#ff8a00 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 4px 16px rgba(255,120,20,.70)) drop-shadow(0 0 36px rgba(255,190,60,.55));}
  .bignum{margin:6px 0 0;display:flex;align-items:baseline;justify-content:center;gap:8px;}
  .bignum .n{font-size:170px;font-weight:900;line-height:1;letter-spacing:-4px;
     background:linear-gradient(180deg,#fffef8 0%,#ffe082 40%,#ffa000 74%,#ff6d00 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 6px 20px rgba(255,90,0,.75)) drop-shadow(0 0 60px rgba(255,200,80,.6));}
  .bignum .u{font-size:46px;font-weight:900;
     background:linear-gradient(180deg,#fffdf3,#ffc107);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 2px 10px rgba(255,120,20,.6));}
  .bigsub{margin:14px 0 0;font-size:22px;font-weight:900;color:#ffe6b0;letter-spacing:3px;
     text-shadow:0 0 18px rgba(255,150,40,.6);}
  .bigdate{margin:8px 0 0;font-size:15px;font-weight:700;color:#f5cf95;letter-spacing:1.5px;}

  .card{position:relative;z-index:2;margin:22px 28px 0;border-radius:16px;overflow:hidden;
     border:1px solid rgba(255,215,120,.38);
     background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.025));
     box-shadow:0 8px 26px rgba(0,0,0,.45), 0 0 24px rgba(255,170,50,.12) inset;}
  .chead{display:flex;align-items:center;gap:10px;padding:12px 18px;
     background:linear-gradient(90deg,rgba(255,206,84,.32),rgba(255,206,84,.05));
     border-bottom:1px solid rgba(255,215,120,.30);}
  .ctitle{font-size:18px;font-weight:900;color:#ffeab4;text-shadow:0 0 12px rgba(255,180,60,.5);}
  .ctag{margin-left:auto;font-size:12.5px;font-weight:800;color:#f0d49a;}
  .chartbox{padding:16px 12px 8px;}

  /* 每日数据条 */
  .days{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 28px 0;}
  .day{text-align:center;padding:14px 6px 12px;border-radius:12px;
     background:linear-gradient(180deg,rgba(255,206,84,.18),rgba(255,206,84,.03));
     border:1px solid rgba(255,215,120,.34);
     box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .day .d{font-size:14px;font-weight:800;color:#f3d7a1;}
  .day .v{display:block;margin-top:6px;font-size:30px;font-weight:900;color:#ffe9b8;
     text-shadow:0 0 16px rgba(255,180,60,.55);}
  .day .t{font-size:11.5px;font-weight:700;color:#d9bd88;}
  .day.top{background:linear-gradient(180deg,rgba(255,120,20,.38),rgba(255,180,60,.10));
     border:1px solid rgba(255,190,90,.75);
     box-shadow:0 0 26px rgba(255,140,20,.45), 0 4px 14px rgba(0,0,0,.35);}
  .day.top .v{font-size:36px;color:#fff6dd;text-shadow:0 0 22px rgba(255,150,20,.95);}
  .day.top .d,.day.top .t{color:#ffe6b4;}
  .day.next{display:flex;align-items:center;justify-content:center;min-height:74px;padding:14px 6px;
     background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));
     border:1px dashed rgba(255,215,120,.55);box-shadow:none;}
  .day.next .nx{font-size:16px;font-weight:900;letter-spacing:2px;color:#f0d49c;
     text-shadow:0 0 14px rgba(255,180,60,.4);}

  .congrats{position:relative;z-index:2;margin:22px 28px 0;padding:20px 18px;border-radius:16px;text-align:center;
     border:1px solid rgba(255,215,120,.5);
     background:linear-gradient(180deg,rgba(255,190,60,.20),rgba(255,120,20,.08));
     box-shadow:0 0 30px rgba(255,160,30,.28) inset;}
  .congrats .c1{font-size:30px;font-weight:900;letter-spacing:4px;line-height:1.45;
     background:linear-gradient(180deg,#fffdf3 0%,#ffe9a0 45%,#ffb300 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 3px 12px rgba(255,130,20,.6));}
  .congrats .c2{margin-top:10px;font-size:16px;font-weight:800;color:#f6dcab;letter-spacing:1.5px;}

  .foot{position:relative;z-index:2;margin:16px 28px 0;text-align:center;
     font-size:13px;font-weight:700;color:#cfae7d;letter-spacing:1px;}
</style>
</head>
<body>
<script>
  if (location.search.indexOf('plain=1') >= 0) document.body.className = 'plain';
</script>
<div class='page'>
  <div class='rays'></div>
  <div class='rays2'></div>
  <div class='glow'></div>
  <div class='spark' style='top:120px;left:70px;animation-delay:-.4s'></div>
  <div class='spark' style='top:200px;right:80px;animation-delay:-1.6s'></div>
  <div class='spark' style='top:330px;left:120px;animation-delay:-2.2s'></div>
  <div class='spark' style='top:1000px;right:110px;animation-delay:-1.1s'></div>
  <div class='spark' style='top:1180px;left:90px;animation-delay:-.8s'></div>

  <header>
    <span class='eyebrow'>东莞区域 · 国庆黄金周</span>
    <h1 class='xibao'>喜　报</h1>
    <div class='bignum'><span class='n'>153</span><span class='u'>台</span></div>
    <p class='bigsub'>东莞区域 产出订单</p>
    <p class='bigdate'>2026年10月7日 ｜ 单日订单量刷新国庆新高</p>
  </header>

  <!-- 折线图 -->
  <div class='card'>
    <div class='chead'>
      <span class='ctitle'>10月1日 - 10月7日 每日订单量</span>
      <span class='ctag'>单位：台</span>
    </div>
    <div class='chartbox'>
      <svg viewBox='0 0 800 330' width='100%' height='330' xmlns='http://www.w3.org/2000/svg'>
        <defs>
          <linearGradient id='area' x1='0' y1='0' x2='0' y2='1'>
            <stop offset='0%' stop-color='#ffb300' stop-opacity='.55'/>
            <stop offset='100%' stop-color='#ffb300' stop-opacity='0'/>
          </linearGradient>
          <linearGradient id='line' x1='0' y1='0' x2='1' y2='0'>
            <stop offset='0%' stop-color='#ffd54f'/>
            <stop offset='60%' stop-color='#ffb300'/>
            <stop offset='100%' stop-color='#ff6d00'/>
          </linearGradient>
        </defs>

        <!-- 网格 + Y轴刻度 -->
        <g stroke='rgba(255,215,120,.22)' stroke-width='1'>
          <line x1='70' y1='30'  x2='770' y2='30'/>
          <line x1='70' y1='85'  x2='770' y2='85'/>
          <line x1='70' y1='140' x2='770' y2='140'/>
          <line x1='70' y1='195' x2='770' y2='195'/>
          <line x1='70' y1='250' x2='770' y2='250'/>
        </g>
        <g fill='#d9bd88' font-size='12' font-weight='700' text-anchor='end'>
          <text x='58' y='34'>160</text>
          <text x='58' y='89'>120</text>
          <text x='58' y='144'>80</text>
          <text x='58' y='199'>40</text>
          <text x='58' y='254'>0</text>
        </g>

        <!-- 面积 -->
        <path d='M70,167.5 L186.7,168.9 L303.3,185.4 L420,171.6 L536.7,97.4 L653.3,212.9 L770,39.6 L770,250 L70,250 Z' fill='url(#area)'/>
        <!-- 折线 -->
        <path d='M70,167.5 L186.7,168.9 L303.3,185.4 L420,171.6 L536.7,97.4 L653.3,212.9 L770,39.6' fill='none' stroke='url(#line)' stroke-width='4.5'
              stroke-linecap='round' stroke-linejoin='round'/>

        <!-- 数据点 -->
        <g>
          <circle cx='70'    cy='167.5' r='6' fill='#ffe082' stroke='#ff8f00' stroke-width='3'/>
          <circle cx='186.7' cy='168.9' r='6' fill='#ffe082' stroke='#ff8f00' stroke-width='3'/>
          <circle cx='303.3' cy='185.4' r='6' fill='#ffe082' stroke='#ff8f00' stroke-width='3'/>
          <circle cx='420'   cy='171.6' r='6' fill='#ffe082' stroke='#ff8f00' stroke-width='3'/>
          <circle cx='536.7' cy='97.4'  r='6' fill='#ffe082' stroke='#ff8f00' stroke-width='3'/>
          <circle cx='653.3' cy='212.9' r='6' fill='#ffe082' stroke='#ff8f00' stroke-width='3'/>
          <circle cx='770'   cy='39.6'  r='10' fill='#fff3c4' stroke='#ff6d00' stroke-width='4'/>
          <circle cx='770'   cy='39.6'  r='17' fill='none' stroke='rgba(255,140,0,.55)' stroke-width='2'/>
        </g>

        <!-- 数值标签 -->
        <g fill='#fff0c4' font-size='20' font-weight='900' text-anchor='middle'>
          <text x='70'    y='146' font-size='17'>60</text>
          <text x='186.7' y='147' font-size='17'>59</text>
          <text x='303.3' y='164' font-size='17'>47</text>
          <text x='420'   y='150' font-size='17'>57</text>
          <text x='536.7' y='76'  font-size='17'>111</text>
          <text x='653.3' y='192' font-size='17'>27</text>
        </g>
        <g>
          <rect x='706' y='8' width='72' height='34' rx='10' fill='#ff6d00' opacity='.95'/>
          <text x='742' y='32' fill='#fff' font-size='22' font-weight='900' text-anchor='middle'>153</text>
        </g>

        <!-- X轴日期 -->
        <g fill='#f3d7a1' font-size='14' font-weight='800' text-anchor='middle'>
          <text x='70'    y='278' font-size='13'>10/1</text>
          <text x='186.7' y='278' font-size='13'>10/2</text>
          <text x='303.3' y='278' font-size='13'>10/3</text>
          <text x='420'   y='278' font-size='13'>10/4</text>
          <text x='536.7' y='278' font-size='13'>10/5</text>
          <text x='653.3' y='278' font-size='13'>10/6</text>
          <text x='770'   y='278' font-size='13'>10/7</text>
        </g>
        <g fill='#c8a978' font-size='11.5' font-weight='700' text-anchor='middle'>
          <text x='70'    y='298'>周四</text>
          <text x='186.7' y='298'>周五</text>
          <text x='303.3' y='298'>周六</text>
          <text x='420'   y='298'>周日</text>
          <text x='536.7' y='298'>周一</text>
          <text x='653.3' y='298'>周二</text>
          <text x='770'   y='298'>周三</text>
        </g>
      </svg>
    </div>
  </div>

  <!-- 每日数据条 -->
  <div class='days'>
    <div class='day'><span class='d'>10/1</span><span class='v'>60</span><span class='t'>台</span></div>
    <div class='day'><span class='d'>10/2</span><span class='v'>59</span><span class='t'>台</span></div>
    <div class='day'><span class='d'>10/3</span><span class='v'>47</span><span class='t'>台</span></div>
    <div class='day'><span class='d'>10/4</span><span class='v'>57</span><span class='t'>台</span></div>
    <div class='day'><span class='d'>10/5</span><span class='v'>111</span><span class='t'>台</span></div>
    <div class='day'><span class='d'>10/6</span><span class='v'>27</span><span class='t'>台</span></div>
    <div class='day top'><span class='d'>10/7</span><span class='v'>153</span><span class='t'>台</span></div>
    <div class='day next'><span class='nx'>荣 耀 待 续</span></div>
  </div>

  <!-- 恭喜 -->
  <div class='congrats'>
    <div class='c1'>恭 喜 东 莞 区 域 零 跑 各 门 店</div>
    <div class='c2'>国庆七日累计订单 514 台 ｜ 10月7日单日 153 台再创新高</div>
  </div>

  <div class='foot'>东莞区域 · 数据截至 2026-10-07 ｜ 每日订单量以门店实报为准</div>
</div>
</body>
</html>
